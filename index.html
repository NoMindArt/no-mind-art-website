<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>No-Mind</title>
  <style>
    :root{
      --bg:#07070A;
      --panel:rgba(0,0,0,.38);
      --stroke:rgba(255,255,255,.10);
      --stroke2:rgba(255,255,255,.14);
      --text:rgba(255,255,255,.82);
      --muted:rgba(255,255,255,.48);
      --faint:rgba(255,255,255,.28);
      --chip:rgba(255,255,255,.05);
      --chipH:rgba(255,255,255,.08);
      --chipA:rgba(255,255,255,.11);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;
      overflow:hidden;
    }

    /* Background */
    canvas#field{
      position:fixed; inset:0;
      width:100%; height:100%;
      display:block;
      opacity:.9;
    }
    .fog{
      position:fixed; inset:-30%;
      background:
        radial-gradient(circle at 20% 25%, rgba(255,255,255,.06), transparent 58%),
        radial-gradient(circle at 75% 78%, rgba(255,255,255,.05), transparent 60%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.03), transparent 55%);
      filter: blur(10px);
      pointer-events:none;
      opacity:.75;
    }

    /* Layout */
    .top{
      position:fixed; left:0; right:0; top:0;
      display:flex; align-items:center; justify-content:space-between;
      padding:24px 28px;
      z-index:10;
      pointer-events:none;
    }
    .brand, .enter{pointer-events:auto}
    .brand{
      display:flex; align-items:center; gap:10px;
      user-select:none;
    }
    .brand img{
      width:34px; height:34px;
      opacity:.85;
      filter: drop-shadow(0 16px 30px rgba(0,0,0,.5));
    }
    .brand .name{
      font-size:12px;
      letter-spacing:.24em;
      color:rgba(255,255,255,.66);
    }
    .enter{
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.04);
      color:rgba(255,255,255,.70);
      border-radius:18px;
      padding:8px 14px;
      font-size:12px;
      letter-spacing:.08em;
      backdrop-filter: blur(8px);
    }
    .enter:hover{background:rgba(255,255,255,.06); border-color:var(--stroke2)}

    .wrap{
      position:relative;
      z-index:9;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:90px 18px 34px;
    }

    .panel{
      width:min(860px, 92vw);
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .promptRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }
    .prompt{
      font-size:12px;
      color:var(--muted);
      letter-spacing:.06em;
    }
    .another{
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.03);
      color:rgba(255,255,255,.55);
      border-radius:16px;
      padding:6px 12px;
      font-size:12px;
      backdrop-filter: blur(8px);
    }
    .another:hover{background:rgba(255,255,255,.05); border-color:var(--stroke2); color:rgba(255,255,255,.7)}

    .chips{
      display:flex; flex-wrap:wrap; gap:8px;
    }
    .chip{
      border:1px solid var(--stroke);
      background:var(--chip);
      color:rgba(255,255,255,.58);
      padding:7px 12px;
      border-radius:999px;
      font-size:12px;
      letter-spacing:.06em;
      user-select:none;
      cursor:pointer;
      transition:all .15s ease;
      backdrop-filter: blur(8px);
    }
    .chip:hover{background:var(--chipH); border-color:var(--stroke2)}
    .chip.active{
      background:var(--chipA);
      color:rgba(255,255,255,.82);
      border-color:rgba(255,255,255,.18);
    }

    .work{
      margin-top:14px;
      padding:30px 28px;
      border:1px solid var(--stroke);
      border-radius:28px;
      background:var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: 0 40px 120px rgba(0,0,0,.65);
      position:relative;
      overflow:hidden;
    }
    .work::before{
      content:"";
      position:absolute; inset:-40%;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.05), transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,.04), transparent 62%);
      opacity:.7;
      pointer-events:none;
    }

    .meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      position:relative;
      z-index:1;
    }
    .id{
      font-size:11px;
      letter-spacing:.34em;
      color:rgba(255,255,255,.44);
    }
    .tag{
      font-size:11px;
      color:rgba(255,255,255,.30);
      letter-spacing:.10em;
      text-transform:uppercase;
    }
    .lineage{
      margin-top:10px;
      font-size:11px;
      color:rgba(255,255,255,.26);
      position:relative;
      z-index:1;
    }
    .lineage a{
      color:rgba(255,255,255,.42);
      text-decoration:none;
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    .lineage a:hover{color:rgba(255,255,255,.62); border-bottom-color:rgba(255,255,255,.18)}

    .content{
      margin-top:18px;
      position:relative;
      z-index:1;
    }
    pre{
      margin:0;
      white-space:pre-wrap;
      font-size:15px;
      line-height:1.85;
      color:rgba(255,255,255,.80);
    }

    .actions{
      margin-top:22px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      position:relative;
      z-index:1;
    }
    .btn{
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.045);
      color:rgba(255,255,255,.78);
      border-radius:18px;
      padding:10px 16px;
      font-size:12px;
      letter-spacing:.10em;
      text-transform:uppercase;
      cursor:pointer;
      transition:all .15s ease;
      backdrop-filter: blur(8px);
    }
    .btn:hover{background:rgba(255,255,255,.07); border-color:var(--stroke2)}
    .hint{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:8px;
      font-size:11px;
      color:rgba(255,255,255,.30);
      letter-spacing:.06em;
    }
    .dot{
      width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.26);
      box-shadow:0 0 18px rgba(255,255,255,.12);
    }

    .foot{
      margin-top:16px;
      text-align:center;
      font-size:11px;
      color:rgba(255,255,255,.22);
      letter-spacing:.06em;
    }

    /* Modal */
    .modalMask{
      position:fixed; inset:0;
      background:rgba(0,0,0,.64);
      backdrop-filter: blur(10px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:50;
    }
    .modal{
      width:min(760px, 92vw);
      border-radius:26px;
      border:1px solid var(--stroke);
      background:rgba(10,10,12,.78);
      box-shadow: 0 50px 140px rgba(0,0,0,.7);
      padding:18px 18px 16px;
    }
    .modalTop{
      display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
      padding:6px 6px 10px;
    }
    .modalTitle{
      font-size:13px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:rgba(255,255,255,.82);
    }
    .modalSub{
      margin-top:6px;
      font-size:12px;
      color:rgba(255,255,255,.45);
      line-height:1.6;
    }
    .close{
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.03);
      color:rgba(255,255,255,.60);
      border-radius:14px;
      padding:6px 10px;
      font-size:12px;
      cursor:pointer;
    }
    .close:hover{background:rgba(255,255,255,.05); border-color:var(--stroke2)}

    .modalBody{padding:8px 6px 12px}
    textarea{
      width:100%;
      height:160px;
      border-radius:18px;
      border:1px solid var(--stroke);
      background:rgba(0,0,0,.32);
      color:rgba(255,255,255,.78);
      padding:14px 14px;
      font-size:13px;
      line-height:1.7;
      outline:none;
      resize:none;
    }
    textarea::placeholder{color:rgba(255,255,255,.22)}
    .row{
      margin-top:12px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .small{
      font-size:11px;
      color:rgba(255,255,255,.32);
      letter-spacing:.06em;
    }
    .primary{
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.10);
      color:rgba(255,255,255,.85);
    }
    .primary:hover{background:rgba(255,255,255,.13)}

    /* Soft fade on content switch */
    .fade{
      animation:fade .22s ease;
    }
    @keyframes fade{
      from{opacity:.65; transform: translateY(2px)}
      to{opacity:1; transform: translateY(0)}
    }

    @media (max-width:560px){
      .work{padding:24px 20px}
      pre{font-size:14px}
      .hint{width:100%; justify-content:flex-start; margin-left:0}
    }
  </style>
</head>
<body>
  <canvas id="field"></canvas>
  <div class="fog"></div>

  <div class="top">
    <div class="brand">
      <!-- 把 logo.svg 放在仓库根目录或同级路径；或改成 /logo.svg -->
      <img src="logo.svg" alt="No-Mind" />
      <div class="name">NO-MIND</div>
    </div>
    <button class="enter" type="button">ENTER</button>
  </div>

  <div class="wrap">
    <div class="panel">
      <div class="promptRow">
        <div class="prompt">选择进入姿态</div>
        <button class="another" id="another" type="button">another</button>
      </div>

      <div class="chips" id="chips"></div>

      <div class="work" id="work">
        <div class="meta">
          <div class="id" id="wid">#000000</div>
          <div class="tag" id="wtag">TXT · 未命名</div>
        </div>
        <div class="lineage" id="lineage">—</div>
        <div class="content" id="content"></div>

        <div class="actions">
          <button class="btn" data-action="release" type="button">Release</button>
          <button class="btn" data-action="relay" type="button">Relay</button>
          <button class="btn" data-action="resonate" type="button">Resonate</button>
          <div class="hint"><span class="dot"></span><span>trace works · not people</span></div>
        </div>
      </div>

      <div class="foot">No lists. No profiles. Only fragments and lineage.</div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modalMask" id="mask">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalTop">
        <div>
          <div class="modalTitle" id="mtitle">RELEASE</div>
          <div class="modalSub" id="msub">—</div>
        </div>
        <button class="close" id="close" type="button">Close</button>
      </div>
      <div class="modalBody" id="mbody"></div>
    </div>
  </div>

  <script>
    // ---------------------------
    // Minimal content pool (demo)
    // ---------------------------
    const STATES = ["静止","漂浮","失眠","回声","低频","未命名"];
    const WORKS = [
      { id:128, type:"txt", mood:"回声", parentId:null, text:"我把一段话放下，\\n不为解释。\\n只为留下痕迹。" },
      { id:45,  type:"txt", mood:"低频", parentId:null, text:"你不需要被理解。\\n你只需要存在。" },
      { id:203, type:"txt", mood:"静止", parentId:45,   text:"今天的光像灰尘。\\n我不去命名它。" },
      { id:77,  type:"txt", mood:"漂浮", parentId:null, text:"我在这里。\\n我不在这里。" },
      { id:9,   type:"txt", mood:"失眠", parentId:null, text:"夜里没有答案。\\n只有呼吸的重复。" },
      { id:311, type:"txt", mood:"未命名", parentId:null, text:"—" }
    ];

    // ---------------------------
    // UI state
    // ---------------------------
    let currentMood = "未命名";
    let currentWork = null;

    const chipsEl = document.getElementById("chips");
    const widEl = document.getElementById("wid");
    const wtagEl = document.getElementById("wtag");
    const lineageEl = document.getElementById("lineage");
    const contentEl = document.getElementById("content");
    const workEl = document.getElementById("work");

    function pad(n){ return String(n).padStart(6,"0"); }

    function renderChips(){
      chipsEl.innerHTML = "";
      STATES.forEach(s=>{
        const b = document.createElement("div");
        b.className = "chip" + (s===currentMood ? " active": "");
        b.textContent = s;
        b.onclick = ()=>{
          currentMood = s;
          renderChips();
          pickAndRender();
        };
        chipsEl.appendChild(b);
      });
    }

    function weightedPick(list, mood){
      // 偏向而非筛选：同 mood 权重 3，其它 1
      const pool = [];
      list.forEach(w=>{
        const wt = (w.mood===mood) ? 3 : 1;
        for(let i=0;i<wt;i++) pool.push(w);
      });
      return pool[Math.floor(Math.random()*pool.length)];
    }

    function renderWork(w){
      currentWork = w;

      widEl.textContent = "#" + pad(w.id);
      wtagEl.textContent = (w.type.toUpperCase()) + " · " + w.mood;

      if(w.parentId){
        lineageEl.innerHTML = 'resonated from <a href="#" id="plink">#'+pad(w.parentId)+'</a>';
        const plink = document.getElementById("plink");
        plink.onclick = (e)=>{
          e.preventDefault();
          // demo: 点击祖先仅做一次“偏向跳转”
          const parent = WORKS.find(x=>x.id===w.parentId) || weightedPick(WORKS, currentMood);
          renderWork(parent);
        };
      }else{
        lineageEl.textContent = "—";
      }

      contentEl.innerHTML = "";
      const pre = document.createElement("pre");
      pre.textContent = w.text || "—";
      contentEl.appendChild(pre);

      workEl.classList.remove("fade");
      void workEl.offsetWidth;
      workEl.classList.add("fade");
    }

    function pickAndRender(){
      const w = weightedPick(WORKS, currentMood);
      renderWork(w);
    }

    document.getElementById("another").onclick = pickAndRender;

    // ---------------------------
    // Modal (minimal, non-poetic)
    // ---------------------------
    const mask = document.getElementById("mask");
    const closeBtn = document.getElementById("close");
    const mtitle = document.getElementById("mtitle");
    const msub = document.getElementById("msub");
    const mbody = document.getElementById("mbody");

    function openModal(kind){
      mask.style.display = "flex";
      mbody.innerHTML = "";

      if(kind==="release"){
        mtitle.textContent = "RELEASE";
        msub.textContent = "发布一段片段。提交后不可编辑。";
        mbody.innerHTML = `
          <textarea placeholder="写下片段…"></textarea>
          <div class="row">
            <div class="small">匿名 · 冻结 · 可追溯（作品）</div>
            <button class="btn primary" id="do" type="button">Let it exist</button>
          </div>
        `;
        document.getElementById("do").onclick = ()=>{ closeModal(); };
      }

      if(kind==="relay"){
        mtitle.textContent = "RELAY";
        msub.textContent = "为这段片段增加存续权重（未来将接入燃料）。";
        mbody.innerHTML = `
          <div class="small" style="line-height:1.8; color:rgba(255,255,255,.55); padding:6px 2px 10px;">
            这不是评价系统。只是一次承担。
          </div>
          <div class="row">
            <div class="small">no profiles · no likes</div>
            <button class="btn primary" id="do" type="button">Relay</button>
          </div>
        `;
        document.getElementById("do").onclick = ()=>{ closeModal(); };
      }

      if(kind==="resonate"){
        mtitle.textContent = "RESONATE";
        msub.textContent = "基于此片段生成新片段（谱系将建立）。";
        mbody.innerHTML = `
          <textarea placeholder="写下你的二创片段…"></textarea>
          <div class="row">
            <div class="small">lineage only</div>
            <button class="btn primary" id="do" type="button">Publish</button>
          </div>
        `;
        document.getElementById("do").onclick = ()=>{ closeModal(); };
      }
    }

    function closeModal(){
      mask.style.display = "none";
    }
    closeBtn.onclick = closeModal;
    mask.addEventListener("click", (e)=>{ if(e.target===mask) closeModal(); });

    document.querySelectorAll("[data-action]").forEach(btn=>{
      btn.addEventListener("click", ()=>openModal(btn.dataset.action));
    });

    renderChips();
    pickAndRender();

    // ---------------------------
    // Particle field (restrained)
    // ---------------------------
    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d", { alpha:true });

    let W=0,H=0, DPR=1;
    function resize(){
      DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      W = Math.floor(window.innerWidth);
      H = Math.floor(window.innerHeight);
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      canvas.style.width = W+"px";
      canvas.style.height = H+"px";
      ctx.setTransform(DPR,0,0,DPR,0,0);
    }
    window.addEventListener("resize", resize);
    resize();

    const N = Math.round((W*H)/22000); // density
    const dots = [];
    function rnd(a,b){ return a + Math.random()*(b-a); }

    for(let i=0;i<N;i++){
      dots.push({
        x:rnd(0,W), y:rnd(0,H),
        vx:rnd(-0.03,0.03), vy:rnd(-0.03,0.03),
        r:rnd(0.6,1.8),
        a:rnd(0.05,0.14),
        p:rnd(0,Math.PI*2)
      });
    }

    let mx = W/2, my = H/2;
    window.addEventListener("mousemove", (e)=>{ mx=e.clientX; my=e.clientY; });

    function frame(t){
      ctx.clearRect(0,0,W,H);

      const breath = 0.55 + 0.45*Math.sin(t/1600);
      // ultra-soft vignette
      ctx.fillStyle = "rgba(0,0,0,0.10)";
      ctx.fillRect(0,0,W,H);

      for(const d of dots){
        // slow drift
        d.x += d.vx;
        d.y += d.vy;

        if(d.x< -20) d.x = W+20;
        if(d.x> W+20) d.x = -20;
        if(d.y< -20) d.y = H+20;
        if(d.y> H+20) d.y = -20;

        // mouse influence (very small)
        const dx = d.x - mx, dy = d.y - my;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const pull = Math.max(0, 1 - dist/260) * 0.35;
        const px = d.x + dx * pull * 0.06;
        const py = d.y + dy * pull * 0.06;

        const a = d.a + breath*0.03 + 0.02*Math.sin(t/1200 + d.p);
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${Math.max(0, Math.min(0.22, a))})`;
        ctx.arc(px, py, d.r, 0, Math.PI*2);
        ctx.fill();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
