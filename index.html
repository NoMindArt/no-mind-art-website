<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>No-Mind</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #07070a;
      color: rgba(255,255,255,0.85);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo {
      position: absolute;
      top: 28px;
      left: 32px;
      opacity: 0.8;
    }

    .logo img {
      width: 36px;
      height: 36px;
    }

    .enter {
      position: absolute;
      top: 28px;
      right: 32px;
      padding: 8px 18px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.05);
    }

    .container {
      width: 90%;
      max-width: 760px;
      text-align: left;
    }

    .state {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 16px;
    }

    .states span {
      display: inline-block;
      margin-right: 10px;
      margin-bottom: 10px;
      padding: 6px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }

    .work {
      margin-top: 40px;
      padding: 36px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.4);
    }

    .work-id {
      font-size: 11px;
      letter-spacing: 0.35em;
      color: rgba(255,255,255,0.45);
    }

    .work-text {
      margin-top: 28px;
      font-size: 15px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .actions {
      margin-top: 32px;
    }

    .actions button {
      margin-right: 12px;
      padding: 10px 22px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.8);
      font-size: 13px;
    }

    .footer {
      margin-top: 36px;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="logo">
    <!-- 把 src 换成你的 logo 文件路径 -->
    <img src="logo.svg" alt="No-Mind">
  </div>

  <div class="enter">Enter</div>

  <div class="container">

    <div class="state">你现在更接近哪种状态？</div>
    <div class="states">
      <span>静止</span>
      <span>漂浮</span>
      <span>失眠</span>
      <span>回声</span>
      <span>低频</span>
      <span>未命名</span>
    </div>

    <div class="work">
      <div class="work-id">#000128</div>

      <div class="work-text">
我把一段话放下，
不是为了被理解，
只是为了让它离开我。
      </div>

      <div class="actions">
        <button>Release</button>
        <button>Relay</button>
        <button>Resonate</button>
      </div>
    </div>

    <div class="footer">
      A place where works are traceable, identities are not.
    </div>

  </div>

</body>
</html>
