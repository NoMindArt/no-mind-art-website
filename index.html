<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>No-Mind</title>

  <style>
    :root{
      --bg:#000;
      --text:rgba(255,255,255,.82);
      --muted:rgba(255,255,255,.46);
      --faint:rgba(255,255,255,.28);
      --stroke:rgba(255,255,255,.12);
      --stroke2:rgba(255,255,255,.18);
      --panel:rgba(0,0,0,.18);
      --panel2:rgba(0,0,0,.35);
      --chip:rgba(255,255,255,.04);
      --chipH:rgba(255,255,255,.07);
      --chipA:rgba(255,255,255,.10);
      --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg);font-family:var(--font);overflow:hidden;}
    canvas{display:block;position:fixed;top:0;left:0;z-index:1;width:100%;height:100%;}

    /* UI layer */
    .ui{
      position:fixed; inset:0;
      z-index:10;
      display:flex; align-items:center; justify-content:center;
      pointer-events:none;
    }
    .frame{
      width:min(920px,92vw);
      pointer-events:auto;
      padding:26px 22px;
      border-radius:28px;
      border:1px solid rgba(255,255,255,.0);
      background:transparent;
      text-shadow: 0 0 14px rgba(0,0,0,1), 0 0 5px rgba(0,0,0,.85);
    }
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      padding-bottom:14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      user-select:none;
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      letter-spacing:.22em;
      color:rgba(255,255,255,.70);
      font-size:12px;
    }
    .brand img{width:30px;height:30px;opacity:.85;filter:drop-shadow(0 18px 28px rgba(0,0,0,.6));}
    .enter{
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.03);
      color:rgba(255,255,255,.62);
      border-radius:18px;
      padding:8px 14px;
      font-size:12px;
      letter-spacing:.10em;
    }
    .enter:hover{border-color:var(--stroke2); background:rgba(255,255,255,.05); color:rgba(255,255,255,.78);}

    .panel{
      margin-top:18px;
      padding:18px 18px 16px;
      border-radius:26px;
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(to bottom, rgba(0,0,0,.10), rgba(0,0,0,.22));
      backdrop-filter: blur(10px);
    }

    .promptRow{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
    }
    .prompt{
      font-size:12px; color:var(--muted);
      letter-spacing:.06em;
    }
    .another{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.02);
      color:rgba(255,255,255,.52);
      border-radius:16px;
      padding:6px 12px;
      font-size:12px;
    }
    .another:hover{border-color:var(--stroke2); background:rgba(255,255,255,.04); color:rgba(255,255,255,.70);}

    .chips{margin-top:12px; display:flex; flex-wrap:wrap; gap:8px;}
    .chip{
      border:1px solid rgba(255,255,255,.10);
      background:var(--chip);
      color:rgba(255,255,255,.56);
      padding:7px 12px;
      border-radius:999px;
      font-size:12px;
      letter-spacing:.06em;
      cursor:pointer;
    }
    .chip:hover{background:var(--chipH); border-color:var(--stroke2)}
    .chip.active{background:var(--chipA); color:rgba(255,255,255,.80); border-color:rgba(255,255,255,.18);}

    .work{
      margin-top:14px;
      padding:20px 18px 16px;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.26);
    }
    .meta{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      font-family:var(--mono);
      font-size:11px;
      color:rgba(255,255,255,.40);
      letter-spacing:.22em;
      text-transform:uppercase;
    }
    .lineage{
      margin-top:10px;
      font-size:11px;
      color:rgba(255,255,255,.26);
      font-family:var(--mono);
      letter-spacing:.06em;
    }
    .lineage a{
      color:rgba(255,255,255,.44);
      text-decoration:none;
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    .lineage a:hover{color:rgba(255,255,255,.70); border-bottom-color:rgba(255,255,255,.18);}

    pre{
      margin:14px 0 0;
      white-space:pre-wrap;
      font-size:14.5px;
      line-height:1.85;
      color:rgba(255,255,255,.78);
    }

    .actions{
      margin-top:16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .btn{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.03);
      color:rgba(255,255,255,.74);
      border-radius:18px;
      padding:10px 14px;
      font-size:12px;
      letter-spacing:.10em;
      text-transform:uppercase;
      cursor:pointer;
    }
    .btn:hover{border-color:var(--stroke2); background:rgba(255,255,255,.06); color:rgba(255,255,255,.86);}
    .hint{
      margin-left:auto;
      display:flex; align-items:center; gap:8px;
      font-size:11px;
      color:rgba(255,255,255,.26);
      font-family:var(--mono);
    }
    .dot{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.22); box-shadow:0 0 18px rgba(255,255,255,.12);}

    .foot{
      margin-top:14px;
      text-align:center;
      font-size:11px;
      color:rgba(255,255,255,.20);
      letter-spacing:.06em;
      font-family:var(--mono);
    }

    /* Modal */
    .mask{
      position:fixed; inset:0;
      background:rgba(0,0,0,.62);
      backdrop-filter: blur(10px);
      z-index:99;
      display:none;
      align-items:center;
      justify-content:center;
    }
    .modal{
      width:min(760px,92vw);
      border-radius:24px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.62);
      padding:16px 16px 14px;
      box-shadow:0 60px 160px rgba(0,0,0,.75);
    }
    .modalTop{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
    .mtitle{
      font-family:var(--mono);
      font-size:12px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:rgba(255,255,255,.78);
    }
    .msub{
      margin-top:6px;
      font-size:12px;
      color:rgba(255,255,255,.42);
      line-height:1.6;
    }
    .close{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.03);
      color:rgba(255,255,255,.58);
      border-radius:14px;
      padding:6px 10px;
      font-size:12px;
      cursor:pointer;
    }
    .close:hover{border-color:var(--stroke2); background:rgba(255,255,255,.05); color:rgba(255,255,255,.76);}

    .mbody{margin-top:12px;}
    textarea{
      width:100%;
      height:160px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.28);
      color:rgba(255,255,255,.76);
      padding:12px 12px;
      font-size:13px;
      line-height:1.75;
      outline:none;
      resize:none;
    }
    textarea::placeholder{color:rgba(255,255,255,.22)}
    .row{margin-top:12px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
    .small{font-size:11px; color:rgba(255,255,255,.28); font-family:var(--mono); letter-spacing:.06em;}
    .primary{border-color:rgba(255,255,255,.18); background:rgba(255,255,255,.10); color:rgba(255,255,255,.86);}
    .primary:hover{background:rgba(255,255,255,.13);}

    @media (max-width:768px){
      html,body{overflow-y:auto; overflow-x:hidden; height:auto; min-height:100%;}
      .ui{position:relative; inset:auto; display:block; padding:16px 0 28px;}
      .frame{width:100%; padding:16px;}
      canvas{position:fixed;}
      .hint{width:100%; justify-content:flex-start; margin-left:0; margin-top:8px;}
    }
  </style>
</head>

<body>
  <canvas id="particleCanvas"></canvas>

  <div class="ui">
    <div class="frame">
      <div class="topbar">
        <div class="brand">
          <img src="logo.svg" alt="No-Mind">
          <div>NO-MIND</div>
        </div>
        <button class="enter" type="button">ENTER</button>
      </div>

      <div class="panel">
        <div class="promptRow">
          <div class="prompt">进入姿态</div>
          <button class="another" id="another" type="button">another</button>
        </div>

        <div class="chips" id="chips"></div>

        <div class="work" id="work">
          <div class="meta">
            <div id="wid">#000000</div>
            <div id="wtag">TXT · 未命名</div>
          </div>

          <div class="lineage" id="lineage">—</div>

          <pre id="wtext">—</pre>

          <div class="actions">
            <button class="btn" data-action="release" type="button">Release</button>
            <button class="btn" data-action="relay" type="button">Relay</button>
            <button class="btn" data-action="resonate" type="button">Resonate</button>
            <div class="hint"><span class="dot"></span><span>trace works · not people</span></div>
          </div>
        </div>

        <div class="foot">no lists · no profiles · only fragments</div>
      </div>
    </div>
  </div>

  <div class="mask" id="mask">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalTop">
        <div>
          <div class="mtitle" id="mtitle">RELEASE</div>
          <div class="msub" id="msub">—</div>
        </div>
        <button class="close" id="close" type="button">Close</button>
      </div>
      <div class="mbody" id="mbody"></div>
    </div>
  </div>

  <script>
    // ---------------------------
    // Minimal content pool (demo)
    // ---------------------------
    const STATES = ["静止","漂浮","失眠","回声","低频","未命名"];
    const WORKS = [
      { id:128, type:"txt", mood:"回声", parentId:null, text:"我把一段话放下。\\n不为解释。\\n只为留下痕迹。" },
      { id:45,  type:"txt", mood:"低频", parentId:null, text:"你不需要被理解。\\n你只需要存在。" },
      { id:203, type:"txt", mood:"静止", parentId:45,   text:"今天的光像灰尘。\\n我不去命名它。" },
      { id:77,  type:"txt", mood:"漂浮", parentId:null, text:"我在这里。\\n我不在这里。" },
      { id:9,   type:"txt", mood:"失眠", parentId:null, text:"夜里没有答案。\\n只有呼吸的重复。" },
      { id:311, type:"txt", mood:"未命名", parentId:null, text:"—" }
    ];

    let currentMood = "未命名";
    let currentWork = null;

    const chipsEl = document.getElementById("chips");
    const widEl = document.getElementById("wid");
    const wtagEl = document.getElementById("wtag");
    const lineageEl = document.getElementById("lineage");
    const wtextEl = document.getElementById("wtext");
    const workEl = document.getElementById("work");

    function pad(n){ return String(n).padStart(6,"0"); }

    function renderChips(){
      chipsEl.innerHTML = "";
      STATES.forEach(s=>{
        const b = document.createElement("div");
        b.className = "chip" + (s===currentMood ? " active": "");
        b.textContent = s;
        b.onclick = ()=>{
          currentMood = s;
          renderChips();
          pickAndRender();
        };
        chipsEl.appendChild(b);
      });
    }

    function weightedPick(list, mood){
      const pool = [];
      list.forEach(w=>{
        const wt = (w.mood===mood) ? 3 : 1;
        for(let i=0;i<wt;i++) pool.push(w);
      });
      return pool[Math.floor(Math.random()*pool.length)];
    }

    function renderWork(w){
      currentWork = w;
      widEl.textContent = "#" + pad(w.id);
      wtagEl.textContent = (w.type.toUpperCase()) + " · " + w.mood;

      if(w.parentId){
        lineageEl.innerHTML = 'resonated from <a href="#" id="plink">#'+pad(w.parentId)+'</a>';
        const plink = document.getElementById("plink");
        plink.onclick = (e)=>{
          e.preventDefault();
          const parent = WORKS.find(x=>x.id===w.parentId) || weightedPick(WORKS, currentMood);
          renderWork(parent);
        };
      }else{
        lineageEl.textContent = "—";
      }
      wtextEl.textContent = w.text || "—";

      workEl.style.opacity = "0.78";
      setTimeout(()=>{ workEl.style.opacity = "1"; }, 120);
    }

    function pickAndRender(){
      renderWork(weightedPick(WORKS, currentMood));
    }

    document.getElementById("another").onclick = pickAndRender;

    // Modal (restrained)
    const mask = document.getElementById("mask");
    const closeBtn = document.getElementById("close");
    const mtitle = document.getElementById("mtitle");
    const msub = document.getElementById("msub");
    const mbody = document.getElementById("mbody");

    function openModal(kind){
      mask.style.display = "flex";
      mbody.innerHTML = "";

      if(kind==="release"){
        mtitle.textContent = "RELEASE";
        msub.textContent = "发布片段。提交后不可编辑。";
        mbody.innerHTML = `
          <textarea placeholder="写下片段…"></textarea>
          <div class="row">
            <div class="small">匿名 · 冻结 · 可追溯（作品）</div>
            <button class="btn primary" id="do" type="button">Let it exist</button>
          </div>
        `;
        document.getElementById("do").onclick = ()=> closeModal();
      }

      if(kind==="relay"){
        mtitle.textContent = "RELAY";
        msub.textContent = "一次承担（未来接入燃料）。";
        mbody.innerHTML = `
          <div class="small" style="line-height:1.8; color:rgba(255,255,255,.55); padding:6px 2px 10px;">
            —
          </div>
          <div class="row">
            <div class="small">no profiles · no likes</div>
            <button class="btn primary" id="do" type="button">Relay</button>
          </div>
        `;
        document.getElementById("do").onclick = ()=> closeModal();
      }

      if(kind==="resonate"){
        mtitle.textContent = "RESONATE";
        msub.textContent = "基于此片段生成新片段（建立谱系）。";
        mbody.innerHTML = `
          <textarea placeholder="写下你的二创片段…"></textarea>
          <div class="row">
            <div class="small">lineage only</div>
            <button class="btn primary" id="do" type="button">Publish</button>
          </div>
        `;
        document.getElementById("do").onclick = ()=> closeModal();
      }
    }
    function closeModal(){ mask.style.display = "none"; }
    closeBtn.onclick = closeModal;
    mask.addEventListener("click", (e)=>{ if(e.target===mask) closeModal(); });

    document.querySelectorAll("[data-action]").forEach(btn=>{
      btn.addEventListener("click", ()=>openModal(btn.dataset.action));
    });

    renderChips();
    pickAndRender();

    // ---------------------------
    // Particle system (from your original, slightly restrained)
    // ---------------------------
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    const isMobile = window.innerWidth < 768;
    const PARTICLE_DENSITY_FACTOR = isMobile ? 600 : 220;
    const MOUSE_INFLUENCE_RADIUS = isMobile ? 150 : 250;
    const MOUSE_DRAG_FORCE = 0.08;
    const FRICTION = 0.94;
    const TIME_SCALE = 0.0005;
    const NEBULA_SCALE = 0.003;

    let width, height;
    let particles = [];
    let mouse = { x: -500, y: -500, active: false };

    function init() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      const dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);

      particles = [];
      let count = Math.floor((width * height) / PARTICLE_DENSITY_FACTOR);
      const maxParticles = isMobile ? 1500 : 6000;
      if (count > maxParticles) count = maxParticles;

      for (let i = 0; i < count; i++) {
        const depth = Math.random();
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          size: Math.random() < 0.8 ? Math.random() * 2 + 0.5 : Math.random() * 3 + 1.5,
          depth: depth,
          hue: 180 + Math.random() * 100,
          baseAlpha: 0.08 + Math.random() * 0.35, /* slightly dimmer */
          angle: Math.random() * Math.PI * 2
        });
      }
    }

    function update() {
      const time = Date.now() * TIME_SCALE;
      for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        const speedFactor = 0.2 + (p.depth * 0.5);
        p.x += Math.sin(p.angle + time) * speedFactor;
        p.y += Math.cos(p.angle + time) * speedFactor;
        p.angle += 0.002;

        if (mouse.active) {
          const dx = mouse.x - p.x;
          const dy = mouse.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < MOUSE_INFLUENCE_RADIUS) {
            const force = (MOUSE_INFLUENCE_RADIUS - dist) / MOUSE_INFLUENCE_RADIUS;
            const swirlX = -dy;
            const swirlY = dx;
            p.vx += swirlX * force * MOUSE_DRAG_FORCE * 0.1 * p.depth;
            p.vy += swirlY * force * MOUSE_DRAG_FORCE * 0.1 * p.depth;
            p.vx += dx * force * 0.005;
            p.vy += dy * force * 0.005;
          }
        }
        p.vx *= FRICTION;
        p.vy *= FRICTION;
        p.x += p.vx;
        p.y += p.vy;

        const margin = 100;
        if (p.x < -margin) p.x = width + margin;
        if (p.x > width + margin) p.x = -margin;
        if (p.y < -margin) p.y = height + margin;
        if (p.y > height + margin) p.y = -margin;
      }
    }

    function draw() {
      ctx.globalCompositeOperation = 'source-over';
      /* dimmer trail to reduce “gamey” feel */
      ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = 'lighter';
      const time = Date.now() * TIME_SCALE;

      for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        if (p.x > -100 && p.x < width + 100 && p.y > -100 && p.y < height + 100) {
          const noise = Math.sin(p.x * NEBULA_SCALE + time) * Math.cos(p.y * NEBULA_SCALE + time * 0.7);
          let spatialAlpha = (noise + 1) / 2;
          spatialAlpha = Math.pow(spatialAlpha, 3);
          let finalAlpha = p.baseAlpha * spatialAlpha;
          let lightness = 38 + (spatialAlpha * 48);

          if (finalAlpha > 0.01) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${p.hue}, 80%, ${lightness}%, ${finalAlpha})`;
            ctx.fill();
          }
        }
      }
      requestAnimationFrame(draw);
      update();
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(init, 250);
    });

    init();
    draw();

    ['mousemove', 'touchmove'].forEach(evt => {
      window.addEventListener(evt, (e) => {
        if (evt === 'touchmove') {
          mouse.x = e.touches[0].clientX;
          mouse.y = e.touches[0].clientY;
        } else {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        }
        mouse.active = true;
      }, { passive: true });
    });

    ['mouseout', 'touchend'].forEach(evt => {
      window.addEventListener(evt, () => { mouse.active = false; });
    });
  </script>
</body>
</html>
